name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Go backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'pull_request' ||
      contains(toJson(github.event.commits.*.modified + github.event.commits.*.added + github.event.commits.*.removed), 'backend/')
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  # ── Flutter console + Dart SDK ────────────────────────────────────────────────
  flutter:
    name: Flutter (console + SDKs)
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'pull_request' ||
      contains(toJson(github.event.commits.*.modified + github.event.commits.*.added + github.event.commits.*.removed), 'console/') ||
      contains(toJson(github.event.commits.*.modified + github.event.commits.*.added + github.event.commits.*.removed), 'sdks/dart/') ||
      contains(toJson(github.event.commits.*.modified + github.event.commits.*.added + github.event.commits.*.removed), 'melos.yaml') ||
      contains(toJson(github.event.commits.*.modified + github.event.commits.*.added + github.event.commits.*.removed), 'pubspec.yaml')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable
          cache: true
      - name: Install Melos
        run: dart pub get
      - name: Bootstrap workspace
        run: dart run melos bootstrap
      - name: Analyze
        run: dart run melos analyze
      - name: Test
        run: dart run melos test

  # ── TypeScript client SDK ─────────────────────────────────────────────────────
  sdk-js:
    name: SDK (TypeScript / client)
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'pull_request' ||
      contains(toJson(github.event.commits.*.modified + github.event.commits.*.added + github.event.commits.*.removed), 'sdks/js/')
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdks/js/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # ── Node.js server SDK ────────────────────────────────────────────────────────
  sdk-node:
    name: SDK (Node.js / server)
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'pull_request' ||
      contains(toJson(github.event.commits.*.modified + github.event.commits.*.added + github.event.commits.*.removed), 'sdks/node/')
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json
      - run: npm ci
      - run: npm run build
