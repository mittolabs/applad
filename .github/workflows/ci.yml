name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Self-host deployability ───────────────────────────────────────────────────
  # Cheap, no dependencies, and guards the one-line install: if compose pulls an
  # image the release workflow does not build, `curl | bash` cannot succeed.
  release-images:
    name: Compose images are built by the release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-release-images.sh

  # ── Go backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'pull_request' ||
      contains(toJson(github.event.commits), 'apps/backend/')
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/backend/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  # ── Dart SDK (Flutter) ────────────────────────────────────────────────────────
  flutter:
    name: Dart SDK
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'pull_request' ||
      contains(toJson(github.event.commits), 'sdks/dart/') ||
      contains(toJson(github.event.commits), 'melos.yaml') ||
      contains(toJson(github.event.commits), 'pubspec.yaml')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable
          cache: true
      - name: Install Melos
        run: dart pub get
      - name: Bootstrap workspace
        run: dart run melos bootstrap
      - name: Analyze
        run: dart run melos analyze
      - name: Test
        run: dart run melos test

  # ── React console ─────────────────────────────────────────────────────────────
  console:
    name: Console (React + Vite)
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'pull_request' ||
      contains(toJson(github.event.commits), 'apps/console/')
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # ── E2E / integration tests ───────────────────────────────────────────────────
  e2e:
    name: E2E tests (Go)
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'pull_request' ||
      contains(toJson(github.event.commits), 'apps/backend/')
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: applad
          POSTGRES_USER: applad
          POSTGRES_PASSWORD: applad
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/backend/go.sum
      - name: Build API
        run: go build -o /tmp/applad-api ./cmd/api
      - name: Build worker-executions
        run: go build -o /tmp/applad-worker-executions ./cmd/workers/executions
      - name: Start API
        env:
          DATABASE_DSN: postgres://applad:applad@localhost:5432/applad?sslmode=disable
          REDIS_ADDR: localhost:6379
          JWT_SECRET: ci-test-secret-not-for-production
          PORT: "8080"
          APP_ENV: development
          CONSOLE_SIGNUP_ENABLED: "true"
        run: /tmp/applad-api &
      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/v1/health && echo " healthy" && break
            echo "  waiting ($i)…"
            sleep 2
          done
      - name: Start worker-executions
        # The API runs the migrations on boot, so start the worker only after the
        # API is healthy — the executions worker consumes the async workflow jobs
        # that TestWorkerExecutionsAsyncPath asserts complete end to end.
        env:
          DATABASE_DSN: postgres://applad:applad@localhost:5432/applad?sslmode=disable
          REDIS_ADDR: localhost:6379
          JWT_SECRET: ci-test-secret-not-for-production
          APP_ENV: development
        run: /tmp/applad-worker-executions &
      - name: Run integration tests
        env:
          APPLAD_API_URL: http://localhost:8080/v1
        run: go test -tags=integration -v -count=1 ./tests/...

  # ── TypeScript client SDK ─────────────────────────────────────────────────────
  sdk-js:
    name: SDK (TypeScript / client)
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'pull_request' ||
      contains(toJson(github.event.commits), 'sdks/js/')
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdks/js/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # ── Node.js server SDK ────────────────────────────────────────────────────────
  sdk-node:
    name: SDK (Node.js / server)
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'pull_request' ||
      contains(toJson(github.event.commits), 'sdks/node/')
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
