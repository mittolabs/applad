name: Release

# Publishing a GitHub Release builds and pushes the GHCR images tagged with that
# release's version (and `latest`, unless it's a pre-release). Cut a release from
# the UI (Draft a new release → pick/create a tag → Publish) or the CLI:
#
#   gh release create v0.3.0 --generate-notes
#
# workflow_dispatch is provided to rebuild a version by hand (e.g. the first run
# against a new layout) without cutting a release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v0.3.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  ORG: mittolabs
  # Version comes from the published release, or the manual dispatch input.
  VERSION: ${{ github.event.release.tag_name || github.event.inputs.tag }}
  # Tag `latest` for full releases and manual builds, but never for pre-releases.
  TAG_LATEST: ${{ (github.event_name == 'release' && !github.event.release.prerelease) || github.event_name == 'workflow_dispatch' }}

jobs:
  # ── API image ────────────────────────────────────────────────────────────────
  api:
    name: Build api image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/applad-api
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ env.TAG_LATEST }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./docker/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Console image ─────────────────────────────────────────────────────────────
  console:
    name: Build console image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/applad-console
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ env.TAG_LATEST }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/console/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Worker images (matrix) ────────────────────────────────────────────────────
  workers:
    name: Build worker-${{ matrix.worker }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        worker:
          - builds
          - certificates
          - databases
          - deletes
          - executions
          - mails
          - messaging
          - migrations
          - usage
          - webhooks
          - cron
          - jobs
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/applad-worker-${{ matrix.worker }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ env.TAG_LATEST }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./docker/worker/Dockerfile
          build-args: WORKER_TYPE=${{ matrix.worker }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker-${{ matrix.worker }}
          cache-to: type=gha,scope=worker-${{ matrix.worker }},mode=max

  # ── CLI binaries (matrix) ─────────────────────────────────────────────────────
  # Cross-compile the `applad` CLI for every OS/arch and attach the binaries to
  # the release, so a user can download one directly instead of building it.
  cli:
    name: Build CLI ${{ matrix.goos }}-${{ matrix.goarch }}
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod

      - name: Build binary
        working-directory: apps/backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="applad-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then out="$out.exe"; fi
          go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/cli
          echo "ASSET=apps/backend/$out" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ env.VERSION }}" "${{ env.ASSET }}" --clobber

  # ── SDK publishing ────────────────────────────────────────────────────────────
  # Publish the client/server SDKs to their public registries so the documented
  # install commands (`npm install @mittolabs/applad`, `pip install applad`,
  # `dart pub add applad`) resolve. Each job builds and tests first, then
  # publishes only on a real published release.
  #
  # REQUIRED REPO SECRETS (jobs fail loudly until these are set and the package
  # names are claimed on each registry):
  #   NPM_TOKEN  — npmjs.com automation token with publish rights to the
  #                @mittolabs scope (used by both sdk-js and sdk-node)
  #   PYPI_TOKEN — PyPI API token (starts with `pypi-`) for the `applad` project
  #   PUB_TOKEN  — pub.dev OAuth token for publishing the `applad` package
  #
  # The Go SDK (github.com/mittolabs/applad-go) is intentionally NOT published
  # here: Go modules are consumed directly by version tag from the repository,
  # so publishing means cutting the release tag — which this workflow already
  # runs on — and there is no registry step to perform.

  # ── TypeScript client SDK → npm (@mittolabs/applad) ───────────────────────────
  publish-sdk-js:
    name: Publish SDK (npm client)
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdks/js/package-lock.json
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Node.js server SDK → npm (@mittolabs/applad-node) ─────────────────────────
  publish-sdk-node:
    name: Publish SDK (npm server)
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Python server SDK → PyPI (applad) ─────────────────────────────────────────
  publish-sdk-python:
    name: Publish SDK (PyPI)
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

  # ── Dart SDK → pub.dev (applad) ───────────────────────────────────────────────
  publish-sdk-dart:
    name: Publish SDK (pub.dev)
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.3"
      - run: dart pub get
      - name: Analyze
        run: dart analyze
      - name: Test
        run: dart test
      - name: Publish to pub.dev
        env:
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
        run: |
          dart pub token add https://pub.dev --env-var PUB_TOKEN
          dart pub publish --force

  # ── Attach install assets to the release ──────────────────────────────────────
  # Only on a real release (dispatch has no release to attach to). Lets a
  # self-hoster grab the exact compose + env for this version.
  assets:
    name: Attach install assets
    if: github.event_name == 'release'
    needs: [api, console, workers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Upload docker-compose.yml + .env.example
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ env.VERSION }}" docker-compose.yml .env.example --clobber
