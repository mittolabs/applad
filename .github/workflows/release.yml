name: Release

# Publishing a GitHub Release builds and pushes the GHCR images tagged with that
# release's version (and `latest`, unless it's a pre-release). Cut a release from
# the UI (Draft a new release → pick/create a tag → Publish) or the CLI:
#
#   gh release create v0.3.0 --generate-notes
#
# workflow_dispatch is provided to rebuild a version by hand (e.g. the first run
# against a new layout) without cutting a release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v0.3.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  ORG: mittolabs
  # Version comes from the published release, or the manual dispatch input.
  VERSION: ${{ github.event.release.tag_name || github.event.inputs.tag }}
  # Tag `latest` for full releases and manual builds, but never for pre-releases.
  TAG_LATEST: ${{ (github.event_name == 'release' && !github.event.release.prerelease) || github.event_name == 'workflow_dispatch' }}

jobs:
  # ── API image ────────────────────────────────────────────────────────────────
  api:
    name: Build api image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/applad-api
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ env.TAG_LATEST }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./docker/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Console image ─────────────────────────────────────────────────────────────
  console:
    name: Build console image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/applad-console
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ env.TAG_LATEST }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/console/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Worker images (matrix) ────────────────────────────────────────────────────
  workers:
    name: Build worker-${{ matrix.worker }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        worker:
          - builds
          - certificates
          - databases
          - deletes
          - executions
          - mails
          - messaging
          - migrations
          - usage
          - webhooks
          - cron
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/applad-worker-${{ matrix.worker }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ env.TAG_LATEST }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./docker/worker/Dockerfile
          build-args: WORKER_TYPE=${{ matrix.worker }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker-${{ matrix.worker }}
          cache-to: type=gha,scope=worker-${{ matrix.worker }},mode=max

  # ── CLI binaries (matrix) ─────────────────────────────────────────────────────
  # Cross-compile the `applad` CLI for every OS/arch and attach the binaries to
  # the release, so a user can download one directly instead of building it.
  cli:
    name: Build CLI ${{ matrix.goos }}-${{ matrix.goarch }}
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod

      - name: Build binary
        working-directory: apps/backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="applad-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then out="$out.exe"; fi
          go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/cli
          echo "ASSET=apps/backend/$out" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ env.VERSION }}" "${{ env.ASSET }}" --clobber

  # ── Attach install assets to the release ──────────────────────────────────────
  # Only on a real release (dispatch has no release to attach to). Lets a
  # self-hoster grab the exact compose + env for this version.
  assets:
    name: Attach install assets
    if: github.event_name == 'release'
    needs: [api, console, workers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Upload docker-compose.yml + .env.example
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ env.VERSION }}" docker-compose.yml .env.example --clobber
