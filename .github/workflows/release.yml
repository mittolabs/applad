name: Release

# Publishes Docker images to GHCR on every version tag (v1.2.3).
# The installer (install.sh) pulls these images — no source build needed.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  ORG: mittolabs

jobs:
  # ── API image ────────────────────────────────────────────────────────────────
  api:
    name: Build api image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/applad-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./docker/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Console image ─────────────────────────────────────────────────────────────
  console:
    name: Build console image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/applad-console
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/console/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Worker images (matrix) ────────────────────────────────────────────────────
  workers:
    name: Build worker-${{ matrix.worker }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        worker:
          - builds
          - certificates
          - databases
          - deletes
          - executions
          - mails
          - messaging
          - migrations
          - usage
          - webhooks
          - cron
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/applad-worker-${{ matrix.worker }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./docker/worker/Dockerfile
          build-args: WORKER_TYPE=${{ matrix.worker }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker-${{ matrix.worker }}
          cache-to: type=gha,scope=worker-${{ matrix.worker }},mode=max

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [api, console, workers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create release with install assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Applad ${{ steps.version.outputs.version }}"
          body: |
            ## Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ env.ORG }}/applad/main/install.sh | bash
            ```

            ## Upgrade

            ```bash
            ./install.sh upgrade
            ```

            ## Images

            | Image | Tag |
            |---|---|
            | `ghcr.io/${{ env.ORG }}/applad-api` | `${{ steps.version.outputs.version }}` |
            | `ghcr.io/${{ env.ORG }}/applad-console` | `${{ steps.version.outputs.version }}` |
            | `ghcr.io/${{ env.ORG }}/applad-worker-*` | `${{ steps.version.outputs.version }}` |
          files: |
            docker-compose.release.yml
            .env.example
          fail_on_unmatched_files: true
          generate_release_notes: true
