name: Feature Request
description: Suggest a new feature or improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Describe it below. Check [open issues](https://github.com/mittolabs/applad/issues) first to avoid duplicates.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Auth
        - Databases
        - Storage
        - Functions
        - Realtime
        - Messaging
        - Workflows
        - Deploy
        - Admin console
        - SDK
        - Self-host / Docker
        - API design
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem you're solving
      placeholder: What are you trying to do that's currently difficult or impossible?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: Describe your idea. Sketches, API shapes, and examples are all welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: What workarounds have you tried?

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a PR for this
