name: Bug Report
description: Something is not working as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: Applad version
      placeholder: "e.g. 1.2.0 or commit SHA"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - API / Backend
        - Admin console
        - Auth
        - Databases
        - Storage
        - Functions
        - Realtime
        - Messaging
        - Workflows
        - Deploy
        - SDK (Dart)
        - SDK (JavaScript)
        - SDK (Node.js)
        - SDK (Go)
        - SDK (Python)
        - Docker / self-host
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: Ubuntu 24.04
        Docker: 26.1
        Storage driver: local / s3
