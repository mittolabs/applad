openapi: 3.0.3
info:
  title: Applad API
  version: 1.0.0
  description: Self-hosted Backend-as-a-Service API
  license:
    name: BSD-3-Clause

servers:
  - url: /v1
    description: Default (relative)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-Applad-Key
  parameters:
    projectHeader:
      name: X-Applad-Project
      in: header
      required: true
      schema:
        type: string
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: integer
        type:
          type: string
        version:
          type: string
    WorkflowNode:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [http_request, send_email, set_variable, code, if_condition, delay]
        label:
          type: string
        config:
          type: object
        position:
          type: object
    WorkflowEdge:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        condition:
          type: string
    Project:
      type: object
      properties:
        $id:
          type: string
        name:
          type: string
        description:
          type: string
        $createdAt:
          type: string
          format: date-time
        $updatedAt:
          type: string
          format: date-time
    User:
      type: object
      properties:
        $id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        emailVerification:
          type: boolean
        phoneVerification:
          type: boolean
        status:
          type: boolean
        labels:
          type: array
          items:
            type: string
        prefs:
          type: object
        $createdAt:
          type: string
          format: date-time
        $updatedAt:
          type: string
          format: date-time
    Session:
      type: object
      properties:
        $id:
          type: string
        userId:
          type: string
        provider:
          type: string
        ip:
          type: string
        userAgent:
          type: string
        expire:
          type: string
          format: date-time
        current:
          type: boolean
        $createdAt:
          type: string
          format: date-time
    Database:
      type: object
      properties:
        $id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        $createdAt:
          type: string
          format: date-time
        $updatedAt:
          type: string
          format: date-time
    Table:
      type: object
      properties:
        $id:
          type: string
        databaseId:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        rowSecurity:
          type: boolean
        $permissions:
          type: array
          items:
            type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/Column'
        indexes:
          type: array
          items:
            $ref: '#/components/schemas/Index'
        $createdAt:
          type: string
          format: date-time
        $updatedAt:
          type: string
          format: date-time
    Column:
      type: object
      properties:
        key:
          type: string
        type:
          type: string
        status:
          type: string
        required:
          type: boolean
        array:
          type: boolean
        default: {}
    Index:
      type: object
      properties:
        key:
          type: string
        type:
          type: string
        status:
          type: string
        attributes:
          type: array
          items:
            type: string
        orders:
          type: array
          items:
            type: string
    Row:
      type: object
      properties:
        $id:
          type: string
        $tableId:
          type: string
        $databaseId:
          type: string
        $permissions:
          type: array
          items:
            type: string
        $createdAt:
          type: string
          format: date-time
        $updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    Bucket:
      type: object
      properties:
        $id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        $permissions:
          type: array
          items:
            type: string
        maximumFileSize:
          type: integer
        allowedFileExtensions:
          type: array
          items:
            type: string
        compression:
          type: string
        encryption:
          type: boolean
        antivirus:
          type: boolean
        $createdAt:
          type: string
          format: date-time
        $updatedAt:
          type: string
          format: date-time
    File:
      type: object
      properties:
        $id:
          type: string
        bucketId:
          type: string
        name:
          type: string
        mimeType:
          type: string
        sizeOriginal:
          type: integer
        $permissions:
          type: array
          items:
            type: string
        $createdAt:
          type: string
          format: date-time
        $updatedAt:
          type: string
          format: date-time
    Team:
      type: object
      properties:
        $id:
          type: string
        name:
          type: string
        total:
          type: integer
        prefs:
          type: object
        $createdAt:
          type: string
          format: date-time
        $updatedAt:
          type: string
          format: date-time
    APIKey:
      type: object
      properties:
        $id:
          type: string
        projectId:
          type: string
        name:
          type: string
        secret:
          type: string
        scopes:
          type: array
          items:
            type: string
        expire:
          type: string
          format: date-time
          nullable: true
        $createdAt:
          type: string
          format: date-time

paths:
  /health:
    get:
      summary: Server health check
      tags: [Health]
      responses:
        '200':
          description: Healthy
  /health/db:
    get:
      summary: Database health check
      tags: [Health]
      responses:
        '200':
          description: Database reachable
  /health/cache:
    get:
      summary: Cache health check
      tags: [Health]
      responses:
        '200':
          description: Redis reachable

  /projects:
    get:
      summary: List projects
      tags: [Projects]
      responses:
        '200':
          description: Project list
    post:
      summary: Create project
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Created

  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get project
      tags: [Projects]
      responses:
        '200':
          description: Project details
    patch:
      summary: Update project
      tags: [Projects]
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete project
      tags: [Projects]
      responses:
        '204':
          description: Deleted

  /projects/{projectId}/keys:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List API keys
      tags: [Projects]
      responses:
        '200':
          description: Key list
    post:
      summary: Create API key
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Key created (secret returned only once)

  /account:
    get:
      summary: Get current account
      tags: [Account]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
    post:
      summary: Create account
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                userId:
                  type: string
                email:
                  type: string
                password:
                  type: string
                name:
                  type: string
      responses:
        '201':
          description: Account created
    delete:
      summary: Delete account
      tags: [Account]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted

  /account/sessions/email:
    post:
      summary: Create email session (login)
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Session created

  /account/sessions/anonymous:
    post:
      summary: Create anonymous session
      tags: [Account]
      responses:
        '201':
          description: Anonymous session created

  /account/sessions:
    get:
      summary: List sessions
      tags: [Account]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session list
    delete:
      summary: Delete all sessions
      tags: [Account]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All sessions deleted

  /databases:
    get:
      summary: List databases
      tags: [Databases]
      security:
        - bearerAuth: []
        - apiKey: []
      responses:
        '200':
          description: Database list
    post:
      summary: Create database
      tags: [Databases]
      security:
        - bearerAuth: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                databaseId:
                  type: string
                name:
                  type: string
      responses:
        '201':
          description: Database created

  /databases/{databaseId}/tables:
    parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List tables
      tags: [Databases]
      responses:
        '200':
          description: Table list
    post:
      summary: Create table
      tags: [Databases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                tableId:
                  type: string
                name:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
                rowSecurity:
                  type: boolean
      responses:
        '201':
          description: Table created

  /databases/{databaseId}/tables/{tableId}/rows:
    parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      - name: tableId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List rows
      tags: [Databases]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Row list
    post:
      summary: Create row
      tags: [Databases]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rowId:
                  type: string
                data:
                  type: object
                permissions:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Row created

  /databases/{databaseId}/sql:
    parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Execute SQL in a database schema
      tags: [Databases]
      security:
        - bearerAuth: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [statement]
              properties:
                statement:
                  type: string
                writeAllowed:
                  type: boolean
      responses:
        '200':
          description: SQL execution result

  /storage/buckets:
    get:
      summary: List buckets
      tags: [Storage]
      responses:
        '200':
          description: Bucket list
    post:
      summary: Create bucket
      tags: [Storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                bucketId:
                  type: string
                name:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
                maximumFileSize:
                  type: integer
                allowedFileExtensions:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Bucket created

  /storage/buckets/{bucketId}/files:
    parameters:
      - name: bucketId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List files
      tags: [Storage]
      responses:
        '200':
          description: File list
    post:
      summary: Upload file
      tags: [Storage]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                fileId:
                  type: string
                file:
                  type: string
                  format: binary
                permissions:
                  type: string
      responses:
        '201':
          description: File uploaded

  /messaging/email:
    post:
      summary: Send email
      tags: [Messaging]
      security:
        - bearerAuth: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, subject]
              properties:
                to:
                  type: array
                  items:
                    type: string
                subject:
                  type: string
                html:
                  type: string
      responses:
        '200':
          description: Email sent

  # ── Console Auth ──────────────────────────────────────────

  /console/signup:
    post:
      summary: Create admin account
      tags: [Console]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
      responses:
        '201':
          description: Account created
        '403':
          description: Signup disabled

  /console/login:
    post:
      summary: Sign in to console
      tags: [Console]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /console/me:
    get:
      summary: Get current console user
      tags: [Console]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
        '401':
          description: Not authenticated

  /console/signup-status:
    get:
      summary: Check if signup is enabled
      tags: [Console]
      responses:
        '200':
          description: Signup status
          content:
            application/json:
              schema:
                type: object
                properties:
                  signupEnabled:
                    type: boolean

  # ── Workflows ─────────────────────────────────────────────

  /workflows:
    post:
      summary: Create workflow
      tags: [Workflows]
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/projectHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                triggerType:
                  type: string
                  enum: [manual, webhook, cron]
                triggerConfig:
                  type: object
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkflowNode'
                edges:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkflowEdge'
      responses:
        '201':
          description: Workflow created
    get:
      summary: List workflows
      tags: [Workflows]
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/projectHeader'
      responses:
        '200':
          description: Workflow list

  /workflows/{workflowId}:
    parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get workflow
      tags: [Workflows]
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/projectHeader'
      responses:
        '200':
          description: Workflow details
    put:
      summary: Update workflow
      tags: [Workflows]
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/projectHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [draft, active, paused]
                triggerType:
                  type: string
                triggerConfig:
                  type: object
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkflowNode'
                edges:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkflowEdge'
      responses:
        '200':
          description: Workflow updated
    delete:
      summary: Delete workflow
      tags: [Workflows]
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/projectHeader'
      responses:
        '204':
          description: Deleted

  /workflows/{workflowId}/execute:
    post:
      summary: Execute workflow
      tags: [Workflows]
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/projectHeader'
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                triggerData:
                  type: object
      responses:
        '202':
          description: Execution started

  /workflows/{workflowId}/executions:
    get:
      summary: List executions
      tags: [Workflows]
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/projectHeader'
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Execution list

  /workflows/{workflowId}/executions/{executionId}:
    get:
      summary: Get execution
      tags: [Workflows]
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/projectHeader'
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
        - name: executionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Execution details

  /workflows/webhooks/{workflowId}:
    post:
      summary: Trigger workflow via webhook
      tags: [Workflows]
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Execution started

  # ── Feature Flags ──────────────────────────────────────────────────────────

  /flags:
    post:
      summary: Create a feature flag
      tags: [Flags]
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/projectHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name]
              properties:
                key:
                  type: string
                name:
                  type: string
                description:
                  type: string
                enabled:
                  type: boolean
                variants:
                  type: object
                rules:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Flag created
    get:
      summary: List feature flags
      tags: [Flags]
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/projectHeader'
      responses:
        '200':
          description: Flag list

  /flags/{flagId}:
    get:
      summary: Get a flag
      tags: [Flags]
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/projectHeader'
        - name: flagId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Flag details
    put:
      summary: Update a flag
      tags: [Flags]
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/projectHeader'
        - name: flagId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Flag updated
    delete:
      summary: Delete a flag
      tags: [Flags]
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/projectHeader'
        - name: flagId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

  /flags/{flagId}/toggle:
    patch:
      summary: Toggle a flag on or off
      tags: [Flags]
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/projectHeader'
        - name: flagId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Flag toggled

  /flags/evaluate:
    post:
      summary: Evaluate flags for a context
      tags: [Flags]
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/projectHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                context:
                  type: object
      responses:
        '200':
          description: Evaluation result

  /flags/evaluate/{key}:
    get:
      summary: Evaluate a single flag by key
      tags: [Flags]
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/projectHeader'
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Flag evaluation

  # ── Analytics ──────────────────────────────────────────────────────────────

  /analytics/events:
    post:
      summary: Track an analytics event
      tags: [Analytics]
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/projectHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                properties:
                  type: object
      responses:
        '201':
          description: Event tracked
    get:
      summary: List analytics events
      tags: [Analytics]
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/projectHeader'
      responses:
        '200':
          description: Event list

  /analytics/events/batch:
    post:
      summary: Batch track events
      tags: [Analytics]
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/projectHeader'
      requestBody:
        required: true
        content:
