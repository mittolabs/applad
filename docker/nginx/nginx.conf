# Name-based virtual hosts for local product development (docker-compose.dev.yml)
# and as the self-host reference. Mirrors the console-facing slice of production:
#
#   local                              production
#   ─────────────────────────────────  ──────────────────
#   console.applad.io.localhost        console.applad.io   → admin console (+ same-origin /v1)
#   api.applad.io.localhost            api.applad.io       → public API for SDKs
#   <sub>.applad.dev.localhost         <sub>.applad.dev    → user-deployed apps
#   (anything else)                    (IP / your domain)  → console fallback
#
# The extra public web properties Mittolabs Cloud runs — the marketing site
# (applad.io), docs (docs.applad.io) and the status page (status.applad.io) —
# are NOT part of a self-hosted install. Their vhosts and the full multi-domain
# edge live in the private mittolabs/applad-cloud repo (roles/proxy). A
# self-hosted box serves only the console; `install.sh` writes an even smaller
# nginx.conf that is just the default-server fallback below.
#
# Browsers resolve any *.localhost host to 127.0.0.1 automatically, so no
# /etc/hosts entry is needed. Only this proxy is published on :80/:443.
#
# Upstreams are resolved per-request via Docker's embedded DNS (127.0.0.11) so
# the proxy still starts if an optional service is down.

resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket upgrades under /v1/ (the studio's live session, realtime) need the
# Upgrade and Connection headers carried through. This maps them so ordinary
# requests are unaffected: no upgrade requested, connection closed as usual.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Admin console ─────────────────────────────────────────────────────────────
# /v1 is proxied here as well, which keeps the console's own API calls
# same-origin.
server {
    listen 80;
    server_name console.applad.io.localhost;   # prod: console.applad.io

    location /v1/ {
        set $up_api api:8080;
        proxy_pass http://$up_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # File uploads (storage objects, deploy source archives) are far larger
        # than nginx's 1m default, which would 413 before reaching the API.
        client_max_body_size 512m;
        # SSE / streaming — flush tokens immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /realtime {
        set $up_api api:8080;
        proxy_pass http://$up_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        set $up_console console:80;
        proxy_pass http://$up_console;
        proxy_set_header Host $host;
    }
}

# ── Public API ────────────────────────────────────────────────────────────────
# The hostname SDKs and customer apps are pointed at. It ends up baked into
# other people's code, so it should never have to move again.
server {
    listen 80;
    server_name api.applad.io.localhost;   # prod: api.applad.io

    location /realtime {
        set $up_api api:8080;
        proxy_pass http://$up_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        set $up_api api:8080;
        proxy_pass http://$up_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 512m;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# ── User-deployed apps: wildcard subdomains ───────────────────────────────────
# <sub>.applad.dev.localhost → the container serving that app. The deploy
# executor names each app's container `applad-site-<sub>` and attaches it to
# this network, so the container name IS the route: Docker's embedded DNS
# resolves it. Subdomains with nothing deployed fall through to a placeholder.
server {
    listen 80;
    server_name ~^(?<sub>[^.]+)\.applad\.dev\.localhost$;   # prod: ~^(?<sub>[^.]+)\.applad\.dev$

    location / {
        set $up_site "applad-site-$sub:80";
        proxy_pass http://$up_site;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nothing deployed (name doesn't resolve / app down) → placeholder.
        proxy_intercept_errors on;
        error_page 502 503 504 = @no_app;
    }

    location @no_app {
        default_type text/html;
        return 200 '<!doctype html><meta charset=utf-8><title>$sub · Applad</title><body style="margin:0;height:100vh;display:grid;place-items:center;background:#0b0b0f;color:#e8e8ea;font:15px/1.6 system-ui"><div style="text-align:center;max-width:440px;padding:24px"><div style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#606068">Applad hosting</div><h1 style="font-size:22px;margin:.4em 0;color:#fff">No app deployed at <span style="color:#3472a4">$sub</span></h1><p style="color:#8a8a92">Deploy a site or container to this project and it will be served here.</p></div></body>';
    }
}

# ── Default host ──────────────────────────────────────────────────────────────
# A self-hosted install has none of the names above: people reach it by IP or
# localhost. So the fallback serves the console and API rather than a 404,
# which is what `install.sh` points at.
server {
    listen 80 default_server;
    server_name _;

    location /v1/ {
        set $up_api api:8080;
        proxy_pass http://$up_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 512m;
        proxy_buffering off;
        proxy_cache off;
        # A recording session is idle between clicks; without a long read
        # timeout the live view would drop every minute.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /realtime {
        set $up_api api:8080;
        proxy_pass http://$up_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        set $up_console console:80;
        proxy_pass http://$up_console;
        proxy_set_header Host $host;
    }
}
