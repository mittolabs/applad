# Name-based virtual hosts. Mirrors the production layout exactly — the only
# difference on a VPS is dropping the `.localhost` suffix:
#
#   local                              production
#   ─────────────────────────────────  ──────────────────
#   applad.io.localhost                applad.io           → marketing site
#   console.applad.io.localhost        console.applad.io   → admin console (+ same-origin /v1)
#   api.applad.io.localhost            api.applad.io       → public API for SDKs
#   docs.applad.io.localhost           docs.applad.io      → documentation
#   status.applad.io.localhost         status.applad.io    → status page
#   <sub>.applad.dev.localhost         <sub>.applad.dev    → user-deployed apps
#   applad.dev.localhost               applad.dev          → apex of the deploy domain
#
# The two domains are deliberate. applad.dev hosts arbitrary customer code, so
# it must not share a registrable domain with the console: on one domain a
# deployed app can set cookies the console would receive, and every app counts
# as same-site with it. Keeping customer apps on applad.dev and everything of
# ours on applad.io removes that whole class of attack. applad.dev should also
# be submitted to the Public Suffix List, which is what stops one customer app
# setting cookies for another.
#
# Browsers resolve any *.localhost host to 127.0.0.1 automatically, so no
# /etc/hosts entry is needed. Only this proxy is published on :80/:443.
#
# Upstreams are resolved per-request via Docker's embedded DNS (127.0.0.11) so
# the proxy still starts if an optional service (website/docs) is down.

resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket upgrades under /v1/ (the studio's live session, realtime) need the
# Upgrade and Connection headers carried through. This maps them so ordinary
# requests are unaffected: no upgrade requested, connection closed as usual.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Marketing site ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name applad.io.localhost;   # prod: applad.io

    location / {
        set $up_website website:80;
        proxy_pass http://$up_website;
        proxy_set_header Host $host;
    }
}

# ── Admin console ─────────────────────────────────────────────────────────────
# A separate origin from the marketing site, so an XSS in a marketing page
# cannot reach console tokens or the project API keys behind them. /v1 is
# proxied here as well, which keeps the console's own API calls same-origin.
server {
    listen 80;
    server_name console.applad.io.localhost;   # prod: console.applad.io

    location /v1/ {
        set $up_api api:8080;
        proxy_pass http://$up_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # File uploads (storage objects, deploy source archives) are far larger
        # than nginx's 1m default, which would 413 before reaching the API.
        client_max_body_size 512m;
        # SSE / streaming — flush tokens immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /realtime {
        set $up_api api:8080;
        proxy_pass http://$up_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        set $up_console console:80;
        proxy_pass http://$up_console;
        proxy_set_header Host $host;
    }
}

# ── Public API ────────────────────────────────────────────────────────────────
# The hostname SDKs and customer apps are pointed at. It ends up baked into
# other people's code, so it should never have to move again.
server {
    listen 80;
    server_name api.applad.io.localhost;   # prod: api.applad.io

    location /realtime {
        set $up_api api:8080;
        proxy_pass http://$up_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        set $up_api api:8080;
        proxy_pass http://$up_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 512m;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# ── Documentation ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name docs.applad.io.localhost;   # prod: docs.applad.io
    location / {
        set $up_docs docs:80;
        proxy_pass http://$up_docs;
        proxy_set_header Host $host;
    }
}

# ── Status page ───────────────────────────────────────────────────────────────
# Reads GET /v1/status from the API, so /v1/ is routed here too (same-origin,
# no CORS).
server {
    listen 80;
    server_name status.applad.io.localhost;   # prod: status.applad.io

    location /v1/ {
        set $up_api api:8080;
        proxy_pass http://$up_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        set $up_status status:80;
        proxy_pass http://$up_status;
        proxy_set_header Host $host;
    }
}

# ── User-deployed apps: wildcard subdomains ───────────────────────────────────
# <sub>.applad.dev.localhost → the container serving that app. The deploy
# executor names each app's container `applad-site-<sub>` and attaches it to
# this network, so the container name IS the route: Docker's embedded DNS
# resolves it. Subdomains with nothing deployed fall through to a placeholder.
server {
    listen 80;
    server_name ~^(?<sub>[^.]+)\.applad\.dev\.localhost$;   # prod: ~^(?<sub>[^.]+)\.applad\.dev$

    location / {
        set $up_site "applad-site-$sub:80";
        proxy_pass http://$up_site;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nothing deployed (name doesn't resolve / app down) → placeholder.
        proxy_intercept_errors on;
        error_page 502 503 504 = @no_app;
    }

    location @no_app {
        default_type text/html;
        return 200 '<!doctype html><meta charset=utf-8><title>$sub · Applad</title><body style="margin:0;height:100vh;display:grid;place-items:center;background:#0b0b0f;color:#e8e8ea;font:15px/1.6 system-ui"><div style="text-align:center;max-width:440px;padding:24px"><div style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#606068">Applad hosting</div><h1 style="font-size:22px;margin:.4em 0;color:#fff">No app deployed at <span style="color:#3472a4">$sub</span></h1><p style="color:#8a8a92">Deploy a site or container to this project and it will be served here.</p></div></body>';
    }
}

# ── Deploy domain apex ────────────────────────────────────────────────────────
# applad.dev itself hosts nothing; it exists to carry customer subdomains.
# Anyone landing here is looking for the product.
server {
    listen 80;
    server_name applad.dev.localhost;   # prod: applad.dev

    location / {
        return 302 http://applad.io.localhost$request_uri;   # prod: https://applad.io$request_uri
    }
}

# ── Default host ──────────────────────────────────────────────────────────────
# A self-hosted install has none of the names above: people reach it by IP or
# localhost. So the fallback serves the console and API rather than a 404,
# which is what `install.sh` points at.
server {
    listen 80 default_server;
    server_name _;

    location /v1/ {
        set $up_api api:8080;
        proxy_pass http://$up_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 512m;
        proxy_buffering off;
        proxy_cache off;
        # A recording session is idle between clicks; without a long read
        # timeout the live view would drop every minute.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /realtime {
        set $up_api api:8080;
        proxy_pass http://$up_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        set $up_console console:80;
        proxy_pass http://$up_console;
        proxy_set_header Host $host;
    }
}
