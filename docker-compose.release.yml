# =============================================================================
# Applad — production release compose
#
# Uses pre-built images from GHCR. This is the file the installer downloads.
# For development (build from source) use docker-compose.yml instead.
#
# Images are published by CI on every release tag:
#   ghcr.io/mittolabs/applad-api:latest
#   ghcr.io/mittolabs/applad-console:latest
#   ghcr.io/mittolabs/applad-worker-{type}:latest
# =============================================================================

x-worker-env: &worker-env
  DATABASE_DSN: "postgres://applad:${DB_PASSWORD}@pgbouncer:5432/applad?sslmode=disable"
  REDIS_ADDR: "redis:6379"
  STORAGE_PATH: "/var/applad/storage"
  APP_ENV: "${APP_ENV:-production}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASS: "${SMTP_PASS:-}"
  SMTP_FROM: "${SMTP_FROM:-noreply@applad.local}"
  STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
  S3_ENDPOINT: "${S3_ENDPOINT:-}"
  S3_BUCKET: "${S3_BUCKET:-}"
  S3_REGION: "${S3_REGION:-us-east-1}"
  S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
  S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
  DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-25}"
  DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-10}"

x-worker-deps: &worker-deps
  pgbouncer:
    condition: service_healthy
  redis:
    condition: service_healthy

x-worker-volumes: &worker-volumes
  - storage_data:/var/applad/storage

# Workers reach the data plane on `internal` and the outside world (git, SMTP,
# webhooks, ACME) through `backend`.
x-worker-networks: &worker-networks
  - internal
  - backend

# Bounded container logs — an unbounded json-file log fills the host disk.
# Deployed customer apps are created straight through the Docker API, so their
# log cap comes from the daemon: set the same json-file limits in
# /etc/docker/daemon.json ("log-driver"/"log-opts") to bound them too.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Resource ceilings so one runaway service cannot starve the box.
x-limits-small: &limits-small
  mem_limit: 512m
  cpus: 1
x-limits-medium: &limits-medium
  mem_limit: 1g
  cpus: 2
x-limits-large: &limits-large
  mem_limit: 4g
  cpus: 2

services:
  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/mittolabs/applad-api:${APPLAD_VERSION:-latest}
    environment:
      PORT: "8080"
      DATABASE_DSN: "postgres://applad:${DB_PASSWORD}@pgbouncer:5432/applad?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${JWT_SECRET}"
      STORAGE_PATH: "/var/applad/storage"
      APP_ENV: "${APP_ENV:-production}"
      STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-25}"
      DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-10}"
      CONSOLE_SIGNUP_ENABLED: "${CONSOLE_SIGNUP_ENABLED:-auto}"
      # AI chat assistant (optional — set AI_PROVIDER + AI_API_KEY + AI_MODEL to enable)
      AI_PROVIDER: "${AI_PROVIDER:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
    volumes:
      - storage_data:/var/applad/storage
    networks:
      - internal
      - backend
      # The recording studio dials browser containers by name, and those live
      # on the deploy network with the customer apps they record against.
      - deploy
    logging: *default-logging
    depends_on: *worker-deps
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    <<: *limits-medium
    restart: unless-stopped

  # ── Console ──────────────────────────────────────────────────────────────────
  console:
    image: ghcr.io/mittolabs/applad-console:${APPLAD_VERSION:-latest}
    networks:
      - backend
    logging: *default-logging
    <<: *limits-small
    restart: unless-stopped

  # ── Reverse proxy ────────────────────────────────────────────────────────────
  proxy:
    image: openresty/openresty:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ssl_certs:/etc/ssl/applad
    networks:
      # backend for our own services; deploy so <app>.applad.dev vhosts can
      # reach customer containers by name. The proxy is the only bridge
      # between the two.
      - backend
      - deploy
    depends_on:
      api:
        condition: service_healthy
      console:
        condition: service_started
    logging: *default-logging
    <<: *limits-small
    restart: unless-stopped

  # ── BuildKit — where source becomes an image ─────────────────────────────────
  #
  # A separate service rather than something inside the builds worker, because
  # BUILDKIT_HOST is an address: pointing it at another machine is how a
  # deploy runs on a server somebody added rather than on this one. Embedding
  # it here would tie every build to the box Applad happens to run on.
  buildkit:
    image: moby/buildkit:v0.28.0
    # BuildKit needs mount and namespace privileges to assemble images.
    privileged: true
    # Reachable over the network rather than through the Docker CLI. The
    # docker-container:// driver shells out to `docker exec`, which would put
    # a Docker CLI inside the worker and tie builds to a local daemon; an
    # address works the same for a builder on another machine, reached
    # through a tunnel.
    command:
      - --addr
      - tcp://0.0.0.0:1234
      - --addr
      - unix:///run/buildkit/buildkitd.sock
    volumes:
      # buildkit_cache grows without bound; prune it periodically, e.g.
      #   docker compose exec buildkit buildctl \
      #     --addr unix:///run/buildkit/buildkitd.sock prune --keep-storage 10gb
      - buildkit_cache:/var/lib/buildkit
    networks:
      # Privileged and unauthenticated, so it shares a network with nothing
      # but the one worker that builds — never the deploy network.
      - build
    logging: *default-logging
    <<: *limits-large
    restart: unless-stopped

  # ── Workers ──────────────────────────────────────────────────────────────────
  worker-builds:
    image: ghcr.io/mittolabs/applad-worker-builds:${APPLAD_VERSION:-latest}
    environment:
      <<: *worker-env
      DOCKER_HOST: "${DOCKER_HOST:-unix:///var/run/docker.sock}"
      # Railpack builds against this. It reaches BuildKit through the Docker
      # API, so the same socket that runs containers also carries the build —
      # which is what will let a remote server build and run in one place.
      BUILDKIT_HOST: "${BUILDKIT_HOST:-tcp://buildkit:1234}"
      # The network deployed customer containers are started on. Only the
      # proxy (routing), the api (studio) and this worker (health checks)
      # also join it, so a customer app cannot see buildkit or postgres.
      APPLAD_DEPLOY_NETWORK: "${APPLAD_DEPLOY_NETWORK:-applad_deploy}"
    volumes:
      - storage_data:/var/applad/storage
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
      - backend
      # Sole peer of buildkit.
      - build
      # Health-checks freshly deployed apps by container name.
      - deploy
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-medium
    restart: unless-stopped

  worker-certificates:
    image: ghcr.io/mittolabs/applad-worker-certificates:${APPLAD_VERSION:-latest}
    environment: *worker-env
    volumes: *worker-volumes
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  worker-databases:
    image: ghcr.io/mittolabs/applad-worker-databases:${APPLAD_VERSION:-latest}
    environment: *worker-env
    volumes: *worker-volumes
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  worker-deletes:
    image: ghcr.io/mittolabs/applad-worker-deletes:${APPLAD_VERSION:-latest}
    environment: *worker-env
    volumes: *worker-volumes
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  worker-executions:
    image: ghcr.io/mittolabs/applad-worker-executions:${APPLAD_VERSION:-latest}
    environment: *worker-env
    volumes: *worker-volumes
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  worker-mails:
    image: ghcr.io/mittolabs/applad-worker-mails:${APPLAD_VERSION:-latest}
    environment: *worker-env
    volumes: *worker-volumes
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  worker-messaging:
    image: ghcr.io/mittolabs/applad-worker-messaging:${APPLAD_VERSION:-latest}
    environment: *worker-env
    volumes: *worker-volumes
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  worker-migrations:
    image: ghcr.io/mittolabs/applad-worker-migrations:${APPLAD_VERSION:-latest}
    environment: *worker-env
    volumes: *worker-volumes
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  worker-usage:
    image: ghcr.io/mittolabs/applad-worker-usage:${APPLAD_VERSION:-latest}
    environment: *worker-env
    volumes: *worker-volumes
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  worker-webhooks:
    image: ghcr.io/mittolabs/applad-worker-webhooks:${APPLAD_VERSION:-latest}
    environment: *worker-env
    volumes: *worker-volumes
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  worker-cron:
    image: ghcr.io/mittolabs/applad-worker-cron:${APPLAD_VERSION:-latest}
    environment: *worker-env
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  # ── Infrastructure ────────────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "applad"
      DB_USER: "applad"
      DB_PASSWORD: "${DB_PASSWORD}"
      LISTEN_PORT: "5432"
      POOL_MODE: "session"
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "${DB_MAX_OPEN_CONNS:-25}"
      AUTH_TYPE: "scram-sha-256"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    logging: *default-logging
    <<: *limits-small
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "applad"
      POSTGRES_USER: "applad"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applad -d applad"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    logging: *default-logging
    <<: *limits-medium
    restart: unless-stopped

  # Scheduled pg_dump into ./backups on the host, with rotation. The postgres
  # image so pg_dump always matches the server's major version.
  pgbackup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: "${DB_PASSWORD}"
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-86400}"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-7}"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while :; do
          f="/backups/applad-$$(date -u +%Y%m%d-%H%M%S).dump"
          pg_dump -Fc -h postgres -U applad -d applad -f "$$f" \
            && echo "pgbackup: wrote $$f" \
            || { echo "pgbackup: dump failed" >&2; rm -f "$$f"; }
          find /backups -name 'applad-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep "$$BACKUP_INTERVAL"
        done
    volumes:
      - ./backups:/backups
    networks:
      - internal
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    <<: *limits-small
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF, so queued build jobs survive a restart rather than living in memory.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    logging: *default-logging
    <<: *limits-small
    restart: unless-stopped

  # ── Optional: antivirus ───────────────────────────────────────────────────────
  clamav:
    image: clamav/clamav:stable
    profiles:
      - antivirus
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      # backend as well: freshclam needs egress for signature updates.
      - internal
      - backend
    logging: *default-logging
    <<: *limits-large
    restart: unless-stopped

networks:
  # Data plane — postgres, pgbouncer, redis, pgbackup. internal: true means no
  # egress and no route in from anything that has not been given membership here.
  internal:
    internal: true
  # Our services and their egress; also what the proxy uses to reach them.
  backend:
  # BuildKit is privileged and unauthenticated: worker-builds is its only peer.
  build:
  # Deployed customer containers. Named explicitly because the builds worker
  # attaches containers to it by name (APPLAD_DEPLOY_NETWORK) through the raw
  # Docker API, outside compose.
  deploy:
    name: applad_deploy

volumes:
  buildkit_cache:
  postgres_data:
  redis_data:
  storage_data:
  ssl_certs:
  clamav_data:
