name: applad

repository: https://github.com/mittolabs/applad

packages:
  - console
  - sdks/dart

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    run: melos exec -- dart analyze .
    description: Run dart analyze in all packages.

  test:
    run: melos exec -- flutter test
    description: Run tests in all packages.

  format:
    run: melos exec -- dart format .
    description: Format all Dart/Flutter packages.

  build:web:
    run: melos exec --scope="applad_console" -- flutter build web --release --dart2js-optimization=O2
    description: Build the Flutter Web console.

  build:web:fast:
    run: melos exec --scope="applad_console" -- flutter build web --release --dart2js-optimization=O1 --no-minify
    description: Build the Flutter Web console with lower memory usage (larger output).
