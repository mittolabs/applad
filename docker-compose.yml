x-worker-build: &worker-build
  context: ./backend
  dockerfile: ../docker/worker/Dockerfile

x-worker-env: &worker-env
  DATABASE_DSN: "postgres://applad:${DB_PASSWORD:-applad}@pgbouncer:5432/applad?sslmode=disable"
  REDIS_ADDR: "redis:6379"
  STORAGE_PATH: "/var/applad/storage"
  APP_ENV: "${APP_ENV:-development}"
  APPLAD_DEPLOY_DOMAIN: "${APPLAD_DEPLOY_DOMAIN:-applad.dev.localhost}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASS: "${SMTP_PASS:-}"
  SMTP_FROM: "${SMTP_FROM:-noreply@applad.local}"
  # Storage driver (local or s3)
  STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
  S3_ENDPOINT: "${S3_ENDPOINT:-}"
  S3_BUCKET: "${S3_BUCKET:-}"
  S3_REGION: "${S3_REGION:-us-east-1}"
  S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
  S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
  # DB connection pool
  DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-25}"
  DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-10}"
  # The builds worker clones repositories, so it needs the GitHub App to mint
  # a token for a private one.
  GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
  GITHUB_APP_SLUG: "${GITHUB_APP_SLUG:-applad}"
  GITHUB_APP_PRIVATE_KEY: "${GITHUB_APP_PRIVATE_KEY:-}"
  GITHUB_APP_PRIVATE_KEY_PATH: "${GITHUB_APP_PRIVATE_KEY_PATH:-/run/secrets/github-app.private-key.pem}"

x-worker-deps: &worker-deps
  pgbouncer:
    condition: service_healthy
  redis:
    condition: service_healthy

x-worker-volumes: &worker-volumes
  - storage_data:/var/applad/storage

services:
  api:
    build:
      context: ./backend
      dockerfile: ../docker/api/Dockerfile
    # Not published to the host — reached only through the proxy at
    # api.applad.io.localhost. (Expose 8080 here if you need direct access.)
    expose:
      - "8080"
    environment:
      PORT: "8080"
      DATABASE_DSN: "postgres://applad:${DB_PASSWORD:-applad}@pgbouncer:5432/applad?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      STORAGE_PATH: "/var/applad/storage"
      APP_ENV: "${APP_ENV:-development}"
      # auto (disabled once the first admin exists), true, or false.
      CONSOLE_SIGNUP_ENABLED: "${CONSOLE_SIGNUP_ENABLED:-auto}"
      RATE_LIMIT_ANON_PER_MINUTE: "${RATE_LIMIT_ANON_PER_MINUTE:-100}"
      RATE_LIMIT_AUTHED_PER_MINUTE: "${RATE_LIMIT_AUTHED_PER_MINUTE:-1200}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_APP_SLUG: "${GITHUB_APP_SLUG:-applad}"
      GITHUB_APP_CLIENT_ID: "${GITHUB_APP_CLIENT_ID:-}"
      GITHUB_APP_CLIENT_SECRET: "${GITHUB_APP_CLIENT_SECRET:-}"
      GITHUB_APP_WEBHOOK_SECRET: "${GITHUB_APP_WEBHOOK_SECRET:-}"
      GITHUB_APP_PRIVATE_KEY: "${GITHUB_APP_PRIVATE_KEY:-}"
      GITHUB_APP_PRIVATE_KEY_PATH: "${GITHUB_APP_PRIVATE_KEY_PATH:-/run/secrets/github-app.private-key.pem}"
      # Parent domain deployed apps answer on, used to show a site's address.
      APPLAD_DEPLOY_DOMAIN: "${APPLAD_DEPLOY_DOMAIN:-applad.dev.localhost}"
      # Optional. Cookie scope is derived from the console's own hostname
      # (console.<parent> shares cookies with <parent>); set this only to
      # override that.
      SESSION_COOKIE_DOMAIN: "${SESSION_COOKIE_DOMAIN:-}"
      STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-25}"
      DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-10}"
      # AI chat — set all three to enable the assistant (see .env.example for model options)
      AI_PROVIDER: "${AI_PROVIDER:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
    volumes:
      - storage_data:/var/applad/storage
      # Read-only, and absent on an instance with no GitHub App — the app is
      # optional and every path degrades without it.
      - ./secrets:/run/secrets:ro
    depends_on: *worker-deps
    restart: unless-stopped

  # React + Vite admin console (served as a static bundle by nginx).
  # Reached through the proxy at console.applad.io.localhost — not published directly.
  console:
    build:
      context: .
      dockerfile: docker/console/Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  # Marketing site → applad.io.localhost
  website:
    build:
      context: .
      dockerfile: docker/website/Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  # Documentation (Fumadocs) → docs.applad.io.localhost
  docs:
    build:
      context: .
      dockerfile: docker/docs/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: "http://applad.io.localhost"
        NEXT_PUBLIC_CONSOLE_URL: "http://console.applad.io.localhost"
    expose:
      - "80"
    restart: unless-stopped

  # Status page → status.applad.io.localhost (reads GET /v1/status)
  status:
    build:
      context: .
      dockerfile: docker/status/Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  proxy:
    image: openresty/openresty:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ssl_certs:/etc/ssl/applad
    depends_on:
      - api
      - console
    restart: unless-stopped

  # BuildKit — where source becomes an image.
  #
  # A separate service rather than something inside the builds worker, because
  # BUILDKIT_HOST is an address: pointing it at another machine is how a
  # deploy runs on a server somebody added rather than on this one. Embedding
  # it here would tie every build to the box Applad happens to run on.
  buildkit:
    image: moby/buildkit:v0.28.0
    # BuildKit needs mount and namespace privileges to assemble images.
    privileged: true
    # Reachable over the network rather than through the Docker CLI. The
    # docker-container:// driver shells out to `docker exec`, which would put
    # a Docker CLI inside the worker and tie builds to a local daemon; an
    # address works the same for a builder on another machine, reached
    # through a tunnel.
    command:
      - --addr
      - tcp://0.0.0.0:1234
      - --addr
      - unix:///run/buildkit/buildkitd.sock
    volumes:
      - buildkit_cache:/var/lib/buildkit
    restart: unless-stopped

  worker-builds:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: builds
    environment:
      <<: *worker-env
      DOCKER_HOST: "${DOCKER_HOST:-unix:///var/run/docker.sock}"
      # Railpack builds against this. It reaches BuildKit through the Docker
      # API, so the same socket that runs containers also carries the build —
      # which is what will let a remote server build and run in one place.
      BUILDKIT_HOST: "${BUILDKIT_HOST:-tcp://buildkit:1234}"
    volumes:
      - storage_data:/var/applad/storage
      - /var/run/docker.sock:/var/run/docker.sock
      # The builds worker is what clones, so it needs the app's key.
      - ./secrets:/run/secrets:ro
    depends_on: *worker-deps
    restart: unless-stopped

  worker-certificates:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: certificates
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-databases:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: databases
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-deletes:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: deletes
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-executions:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: executions
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-mails:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: mails
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-messaging:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: messaging
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-migrations:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: migrations
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-usage:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: usage
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-webhooks:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: webhooks
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-cron:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: cron
    environment: *worker-env
    depends_on: *worker-deps
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "applad"
      DB_USER: "applad"
      DB_PASSWORD: "${DB_PASSWORD:-applad}"
      LISTEN_PORT: "5432"
      POOL_MODE: "session"
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "${DB_MAX_OPEN_CONNS:-25}"
      AUTH_TYPE: "scram-sha-256"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "applad"
      POSTGRES_USER: "applad"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-applad}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applad -d applad"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    profiles:
      - antivirus
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

volumes:
  buildkit_cache:
  postgres_data:
  redis_data:
  storage_data:
  ssl_certs:
  clamav_data:
