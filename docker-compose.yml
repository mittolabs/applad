x-worker-build: &worker-build
  context: ./backend
  dockerfile: ../docker/worker/Dockerfile

x-worker-env: &worker-env
  DATABASE_DSN: "postgres://applad:${DB_PASSWORD:-applad}@postgres:5432/applad?sslmode=disable"
  REDIS_ADDR: "redis:6379"
  POSTGREST_URL: "http://postgrest:3000"
  STORAGE_PATH: "/var/applad/storage"
  APP_ENV: "${APP_ENV:-development}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASS: "${SMTP_PASS:-}"
  SMTP_FROM: "${SMTP_FROM:-noreply@applad.local}"

x-worker-deps: &worker-deps
  postgres:
    condition: service_healthy
  postgrest:
    condition: service_started
  redis:
    condition: service_healthy

x-worker-volumes: &worker-volumes
  - storage_data:/var/applad/storage

services:
  api:
    build:
      context: ./backend
      dockerfile: ../docker/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_DSN: "postgres://applad:${DB_PASSWORD:-applad}@postgres:5432/applad?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      POSTGREST_URL: "http://postgrest:3000"
      STORAGE_PATH: "/var/applad/storage"
      APP_ENV: "${APP_ENV:-development}"
    volumes:
      - storage_data:/var/applad/storage
    depends_on: *worker-deps
    restart: unless-stopped

  console:
    build:
      context: .
      dockerfile: docker/console/Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped

  proxy:
    image: openresty/openresty:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ssl_certs:/etc/ssl/applad
    depends_on:
      - api
      - console
    restart: unless-stopped

  worker-builds:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: builds
    environment: *worker-env
    volumes:
      - storage_data:/var/applad/storage
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: *worker-deps
    restart: unless-stopped

  worker-certificates:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: certificates
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-databases:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: databases
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-deletes:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: deletes
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-executions:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: executions
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-mails:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: mails
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-messaging:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: messaging
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-migrations:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: migrations
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-usage:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: usage
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-webhooks:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: webhooks
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-cron:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: cron
    environment: *worker-env
    depends_on: *worker-deps
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "applad"
      POSTGRES_USER: "applad"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-applad}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applad -d applad"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgrest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: "postgres://applad:${DB_PASSWORD:-applad}@postgres:5432/applad"
      PGRST_DB_SCHEMAS: "public,applad"
      PGRST_DB_ANON_ROLE: "applad_anon"
      PGRST_JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      PGRST_DB_PRE_REQUEST: "applad.check_jwt"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    profiles:
      - antivirus
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
  ssl_certs:
  clamav_data:
