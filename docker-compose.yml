x-worker-build: &worker-build
  context: ./apps/backend
  dockerfile: ../../docker/worker/Dockerfile

x-worker-env: &worker-env
  DATABASE_DSN: "postgres://applad:${DB_PASSWORD:-applad}@pgbouncer:5432/applad?sslmode=disable"
  REDIS_ADDR: "redis:6379"
  STORAGE_PATH: "/var/applad/storage"
  APP_ENV: "${APP_ENV:-development}"
  APPLAD_DEPLOY_DOMAIN: "${APPLAD_DEPLOY_DOMAIN:-applad.dev.localhost}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASS: "${SMTP_PASS:-}"
  SMTP_FROM: "${SMTP_FROM:-noreply@applad.local}"
  # Storage driver (local or s3)
  STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
  S3_ENDPOINT: "${S3_ENDPOINT:-}"
  S3_BUCKET: "${S3_BUCKET:-}"
  S3_REGION: "${S3_REGION:-us-east-1}"
  S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
  S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
  # DB connection pool
  DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-25}"
  DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-10}"
  # The builds worker clones repositories, so it needs the GitHub App to mint
  # a token for a private one.
  GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
  GITHUB_APP_SLUG: "${GITHUB_APP_SLUG:-applad}"
  GITHUB_APP_PRIVATE_KEY: "${GITHUB_APP_PRIVATE_KEY:-}"
  GITHUB_APP_PRIVATE_KEY_PATH: "${GITHUB_APP_PRIVATE_KEY_PATH:-/run/secrets/github-app.private-key.pem}"

x-worker-deps: &worker-deps
  pgbouncer:
    condition: service_healthy
  redis:
    condition: service_healthy

x-worker-volumes: &worker-volumes
  - storage_data:/var/applad/storage

# Workers reach the data plane on `internal` and the outside world (git, SMTP,
# webhooks, ACME) through `backend`.
x-worker-networks: &worker-networks
  - internal
  - backend

# Bounded container logs — an unbounded json-file log fills the host disk.
# Deployed customer apps are created straight through the Docker API, so their
# log cap comes from the daemon: set the same json-file limits in
# /etc/docker/daemon.json ("log-driver"/"log-opts") to bound them too.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Liveness for the workers. Each worker touches /tmp/.worker_alive on every loop
# iteration (queue workers every ~5s while idle; cron every minute), so a file
# that has not been touched recently means the process is hung rather than
# merely idle — which a "process is running" check cannot tell apart. The 120s
# threshold clears the cron worker's one-minute cadence with margin, and three
# retries mean a single slow tick does not flap the service unhealthy.
x-worker-healthcheck: &worker-healthcheck
  test: ["CMD-SHELL", "find /tmp/.worker_alive -newermt '-120 seconds' | grep -q ."]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 90s

# Resource ceilings so one runaway service cannot starve the box.
x-limits-small: &limits-small
  mem_limit: 512m
  cpus: 1
x-limits-medium: &limits-medium
  mem_limit: 1g
  cpus: 2
x-limits-large: &limits-large
  mem_limit: 4g
  cpus: 2

services:
  api:
    image: ghcr.io/mittolabs/applad-api:${APPLAD_VERSION:-latest}
    build:
      context: ./apps/backend
      dockerfile: ../../docker/api/Dockerfile
    # Not published to the host — reached only through the proxy at
    # api.applad.io.localhost. (Expose 8080 here if you need direct access.)
    expose:
      - "8080"
    environment:
      PORT: "8080"
      DATABASE_DSN: "postgres://applad:${DB_PASSWORD:-applad}@pgbouncer:5432/applad?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      STORAGE_PATH: "/var/applad/storage"
      APP_ENV: "${APP_ENV:-development}"
      # auto (disabled once the first admin exists), true, or false.
      CONSOLE_SIGNUP_ENABLED: "${CONSOLE_SIGNUP_ENABLED:-auto}"
      RATE_LIMIT_ANON_PER_MINUTE: "${RATE_LIMIT_ANON_PER_MINUTE:-100}"
      RATE_LIMIT_AUTHED_PER_MINUTE: "${RATE_LIMIT_AUTHED_PER_MINUTE:-1200}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_APP_SLUG: "${GITHUB_APP_SLUG:-applad}"
      GITHUB_APP_CLIENT_ID: "${GITHUB_APP_CLIENT_ID:-}"
      GITHUB_APP_CLIENT_SECRET: "${GITHUB_APP_CLIENT_SECRET:-}"
      GITHUB_APP_WEBHOOK_SECRET: "${GITHUB_APP_WEBHOOK_SECRET:-}"
      GITHUB_APP_PRIVATE_KEY: "${GITHUB_APP_PRIVATE_KEY:-}"
      GITHUB_APP_PRIVATE_KEY_PATH: "${GITHUB_APP_PRIVATE_KEY_PATH:-/run/secrets/github-app.private-key.pem}"
      # Parent domain deployed apps answer on, used to show a site's address.
      APPLAD_DEPLOY_DOMAIN: "${APPLAD_DEPLOY_DOMAIN:-applad.dev.localhost}"
      # Optional. Cookie scope is derived from the console's own hostname
      # (console.<parent> shares cookies with <parent>); set this only to
      # override that.
      SESSION_COOKIE_DOMAIN: "${SESSION_COOKIE_DOMAIN:-}"
      STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-25}"
      DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-10}"
      # AI chat — set all three to enable the assistant (see .env.example for model options)
      AI_PROVIDER: "${AI_PROVIDER:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
    volumes:
      - storage_data:/var/applad/storage
      # Read-only, and absent on an instance with no GitHub App — the app is
      # optional and every path degrades without it.
      - ./secrets:/run/secrets:ro
    networks:
      - internal
      - backend
      # The recording studio dials browser containers by name, and those live
      # on the deploy network with the customer apps they record against.
      - deploy
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-medium
    restart: unless-stopped

  # React + Vite admin console (served as a static bundle by Caddy).
  # Reached through the proxy at console.applad.io.localhost — not published directly.
  console:
    image: ghcr.io/mittolabs/applad-console:${APPLAD_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/console/Dockerfile
    expose:
      - "80"
    networks:
      - backend
    logging: *default-logging
    <<: *limits-small
    restart: unless-stopped

  # The marketing site (applad.io), docs (docs.applad.io) and status page
  # (status.applad.io) are NOT part of a self-hosted install — they are the
  # extra web properties Mittolabs Cloud runs, provisioned by the private
  # applad-cloud repo. This compose builds only the console-facing stack.

  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy stores issued certs here — persist so they survive restarts.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      # backend for our own services; deploy so <app>.applad.dev vhosts can
      # reach customer containers by name. The proxy is the only bridge
      # between the two.
      - backend
      - deploy
    logging: *default-logging
    depends_on:
      - api
      - console
    <<: *limits-small
    restart: unless-stopped

  # BuildKit — where source becomes an image.
  #
  # A separate service rather than something inside the builds worker, because
  # BUILDKIT_HOST is an address: pointing it at another machine is how a
  # deploy runs on a server somebody added rather than on this one. Embedding
  # it here would tie every build to the box Applad happens to run on.
  buildkit:
    image: moby/buildkit:v0.28.0
    # BuildKit needs mount and namespace privileges to assemble images.
    privileged: true
    # Reachable over the network rather than through the Docker CLI. The
    # docker-container:// driver shells out to `docker exec`, which would put
    # a Docker CLI inside the worker and tie builds to a local daemon; an
    # address works the same for a builder on another machine, reached
    # through a tunnel.
    command:
      - --addr
      - tcp://0.0.0.0:1234
      - --addr
      - unix:///run/buildkit/buildkitd.sock
    volumes:
      # buildkit_cache grows without bound; prune it periodically, e.g.
      #   docker compose exec buildkit buildctl \
      #     --addr unix:///run/buildkit/buildkitd.sock prune --keep-storage 10gb
      - buildkit_cache:/var/lib/buildkit
    networks:
      # Privileged and unauthenticated, so it shares a network with nothing
      # but the one worker that builds — never the deploy network.
      - build
    logging: *default-logging
    <<: *limits-large
    restart: unless-stopped

  worker-builds:
    image: ghcr.io/mittolabs/applad-worker-builds:${APPLAD_VERSION:-latest}
    healthcheck: *worker-healthcheck
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: builds
    environment:
      <<: *worker-env
      DOCKER_HOST: "${DOCKER_HOST:-unix:///var/run/docker.sock}"
      # Railpack builds against this. It reaches BuildKit through the Docker
      # API, so the same socket that runs containers also carries the build —
      # which is what will let a remote server build and run in one place.
      BUILDKIT_HOST: "${BUILDKIT_HOST:-tcp://buildkit:1234}"
      # The network deployed customer containers are started on. Only the
      # proxy (routing), the api (studio) and this worker (health checks)
      # also join it, so a customer app cannot see buildkit or postgres.
      APPLAD_DEPLOY_NETWORK: "${APPLAD_DEPLOY_NETWORK:-applad_deploy}"
    volumes:
      - storage_data:/var/applad/storage
      - /var/run/docker.sock:/var/run/docker.sock
      # The builds worker is what clones, so it needs the app's key.
      - ./secrets:/run/secrets:ro
    networks:
      - internal
      - backend
      # Sole peer of buildkit.
      - build
      # Health-checks freshly deployed apps by container name.
      - deploy
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-medium
    restart: unless-stopped

  worker-certificates:
    image: ghcr.io/mittolabs/applad-worker-certificates:${APPLAD_VERSION:-latest}
    healthcheck: *worker-healthcheck
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: certificates
    environment: *worker-env
    volumes: *worker-volumes
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  worker-databases:
    image: ghcr.io/mittolabs/applad-worker-databases:${APPLAD_VERSION:-latest}
    healthcheck: *worker-healthcheck
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: databases
    environment: *worker-env
    volumes: *worker-volumes
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  worker-deletes:
    image: ghcr.io/mittolabs/applad-worker-deletes:${APPLAD_VERSION:-latest}
    healthcheck: *worker-healthcheck
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: deletes
    environment: *worker-env
    volumes: *worker-volumes
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  worker-executions:
    image: ghcr.io/mittolabs/applad-worker-executions:${APPLAD_VERSION:-latest}
    healthcheck: *worker-healthcheck
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: executions
    environment: *worker-env
    volumes: *worker-volumes
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  worker-mails:
    image: ghcr.io/mittolabs/applad-worker-mails:${APPLAD_VERSION:-latest}
    healthcheck: *worker-healthcheck
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: mails
    environment: *worker-env
    volumes: *worker-volumes
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  worker-messaging:
    image: ghcr.io/mittolabs/applad-worker-messaging:${APPLAD_VERSION:-latest}
    healthcheck: *worker-healthcheck
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: messaging
    environment: *worker-env
    volumes: *worker-volumes
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  worker-migrations:
    image: ghcr.io/mittolabs/applad-worker-migrations:${APPLAD_VERSION:-latest}
    healthcheck: *worker-healthcheck
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: migrations
    environment: *worker-env
    volumes: *worker-volumes
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  worker-usage:
    image: ghcr.io/mittolabs/applad-worker-usage:${APPLAD_VERSION:-latest}
    healthcheck: *worker-healthcheck
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: usage
    environment: *worker-env
    volumes: *worker-volumes
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  worker-webhooks:
    image: ghcr.io/mittolabs/applad-worker-webhooks:${APPLAD_VERSION:-latest}
    healthcheck: *worker-healthcheck
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: webhooks
    environment: *worker-env
    volumes: *worker-volumes
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  worker-cron:
    image: ghcr.io/mittolabs/applad-worker-cron:${APPLAD_VERSION:-latest}
    healthcheck: *worker-healthcheck
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: cron
    environment: *worker-env
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  worker-jobs:
    image: ghcr.io/mittolabs/applad-worker-jobs:${APPLAD_VERSION:-latest}
    healthcheck: *worker-healthcheck
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: jobs
    environment: *worker-env
    networks: *worker-networks
    logging: *default-logging
    depends_on: *worker-deps
    <<: *limits-small
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "applad"
      DB_USER: "applad"
      DB_PASSWORD: "${DB_PASSWORD:-applad}"
      LISTEN_PORT: "5432"
      POOL_MODE: "session"
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "${DB_MAX_OPEN_CONNS:-25}"
      AUTH_TYPE: "scram-sha-256"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    logging: *default-logging
    <<: *limits-small
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "applad"
      POSTGRES_USER: "applad"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-applad}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applad -d applad"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First boot runs the init SQL and restarts the server; without a grace
      # period those early probes count as failures and dependents (pgbouncer)
      # abort before postgres is really up.
      start_period: 40s
    networks:
      - internal
    logging: *default-logging
    <<: *limits-medium
    restart: unless-stopped

  # Scheduled pg_dump into ./backups on the host, with rotation. The postgres
  # image so pg_dump always matches the server's major version.
  pgbackup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: "${DB_PASSWORD:-applad}"
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-86400}"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-7}"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while :; do
          f="/backups/applad-$$(date -u +%Y%m%d-%H%M%S).dump"
          pg_dump -Fc -h postgres -U applad -d applad -f "$$f" \
            && echo "pgbackup: wrote $$f" \
            || { echo "pgbackup: dump failed" >&2; rm -f "$$f"; }
          find /backups -name 'applad-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep "$$BACKUP_INTERVAL"
        done
    volumes:
      - ./backups:/backups
    networks:
      - internal
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    <<: *limits-small
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF, so queued build jobs survive a restart rather than living in memory.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    logging: *default-logging
    <<: *limits-small
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    profiles:
      - antivirus
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      # backend as well: freshclam needs egress for signature updates.
      - internal
      - backend
    logging: *default-logging
    <<: *limits-large
    restart: unless-stopped

networks:
  # Data plane — postgres, pgbouncer, redis. internal: true means no egress
  # and no route in from anything that has not been given membership here.
  internal:
    internal: true
  # Our services and their egress; also what the proxy uses to reach them.
  backend:
  # BuildKit is privileged and unauthenticated: worker-builds is its only peer.
  build:
  # Deployed customer containers. Named explicitly because the builds worker
  # attaches containers to it by name (APPLAD_DEPLOY_NETWORK) through the raw
  # Docker API, outside compose.
  deploy:
    name: applad_deploy

volumes:
  buildkit_cache:
  postgres_data:
  redis_data:
  storage_data:
  caddy_data:
  caddy_config:
  clamav_data:
