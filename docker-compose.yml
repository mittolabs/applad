x-worker-build: &worker-build
  context: ./backend
  dockerfile: ../docker/worker/Dockerfile

x-worker-env: &worker-env
  DATABASE_DSN: "postgres://applad:${DB_PASSWORD:-applad}@pgbouncer:5432/applad?sslmode=disable"
  REDIS_ADDR: "redis:6379"
  STORAGE_PATH: "/var/applad/storage"
  APP_ENV: "${APP_ENV:-development}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASS: "${SMTP_PASS:-}"
  SMTP_FROM: "${SMTP_FROM:-noreply@applad.local}"
  # Storage driver (local or s3)
  STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
  S3_ENDPOINT: "${S3_ENDPOINT:-}"
  S3_BUCKET: "${S3_BUCKET:-}"
  S3_REGION: "${S3_REGION:-us-east-1}"
  S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
  S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
  # DB connection pool
  DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-25}"
  DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-10}"

x-worker-deps: &worker-deps
  pgbouncer:
    condition: service_healthy
  redis:
    condition: service_healthy

x-worker-volumes: &worker-volumes
  - storage_data:/var/applad/storage

services:
  api:
    build:
      context: ./backend
      dockerfile: ../docker/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_DSN: "postgres://applad:${DB_PASSWORD:-applad}@pgbouncer:5432/applad?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      STORAGE_PATH: "/var/applad/storage"
      APP_ENV: "${APP_ENV:-development}"
      STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-25}"
      DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-10}"
      # AI chat — set all three to enable the assistant (see .env.example for model options)
      AI_PROVIDER: "${AI_PROVIDER:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
    volumes:
      - storage_data:/var/applad/storage
    depends_on: *worker-deps
    restart: unless-stopped

  # React + Vite admin console (served as a static bundle by nginx).
  console:
    build:
      context: .
      dockerfile: docker/console/Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped

  proxy:
    image: openresty/openresty:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ssl_certs:/etc/ssl/applad
    depends_on:
      - api
      - console
    restart: unless-stopped

  worker-builds:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: builds
    environment:
      <<: *worker-env
      DOCKER_HOST: "${DOCKER_HOST:-unix:///var/run/docker.sock}"
    volumes:
      - storage_data:/var/applad/storage
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: *worker-deps
    restart: unless-stopped

  worker-certificates:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: certificates
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-databases:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: databases
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-deletes:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: deletes
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-executions:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: executions
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-mails:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: mails
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-messaging:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: messaging
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-migrations:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: migrations
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-usage:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: usage
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-webhooks:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: webhooks
    environment: *worker-env
    volumes: *worker-volumes
    depends_on: *worker-deps
    restart: unless-stopped

  worker-cron:
    build:
      <<: *worker-build
      args:
        WORKER_TYPE: cron
    environment: *worker-env
    depends_on: *worker-deps
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "applad"
      DB_USER: "applad"
      DB_PASSWORD: "${DB_PASSWORD:-applad}"
      LISTEN_PORT: "5432"
      POOL_MODE: "session"
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "${DB_MAX_OPEN_CONNS:-25}"
      AUTH_TYPE: "scram-sha-256"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "applad"
      POSTGRES_USER: "applad"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-applad}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applad -d applad"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    profiles:
      - antivirus
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
  ssl_certs:
  clamav_data:
