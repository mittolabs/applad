apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: applad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: bitnami/pgbouncer:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_HOST
              value: postgres
            - name: POSTGRESQL_PORT
              value: "5432"
            - name: POSTGRESQL_DATABASE
              value: applad
            - name: POSTGRESQL_USERNAME
              value: applad
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: applad-secret
                  key: DB_PASSWORD
            - name: PGBOUNCER_DATABASE
              value: applad
            - name: PGBOUNCER_PORT
              value: "5432"
            - name: PGBOUNCER_POOL_MODE
              value: session
            - name: PGBOUNCER_MAX_CLIENT_CONN
              value: "1000"
            - name: PGBOUNCER_DEFAULT_POOL_SIZE
              value: "25"
            - name: PGBOUNCER_AUTH_TYPE
              value: md5
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: applad
spec:
  selector:
    app: pgbouncer
  ports:
    - port: 5432
      targetPort: 5432
