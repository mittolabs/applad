# All 10 workers share the same image; WORKER_TYPE selects the binary at runtime.
# The builds worker requires a Docker socket or DOCKER_HOST (TCP) for image builds.

x-worker-template: &worker-template
  image: ghcr.io/mittolabs/applad-worker:${APPLAD_VERSION:-latest}
  envFrom:
    - configMapRef:
        name: applad-config
    - secretRef:
        name: applad-secret
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  volumeMounts:
    - name: storage
      mountPath: /var/applad/storage

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-builds
  namespace: applad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-builds
  template:
    metadata:
      labels:
        app: worker-builds
    spec:
      containers:
        - name: worker
          image: ghcr.io/mittolabs/applad-worker:${APPLAD_VERSION:-latest}
          args: ["builds"]
          envFrom:
            - configMapRef:
                name: applad-config
            - secretRef:
                name: applad-secret
          env:
            # Point to a Docker daemon accessible from the cluster.
            # For DinD: set to tcp://dind:2375
            # For host socket: mount /var/run/docker.sock and use unix:// path
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
          volumeMounts:
            - name: storage
              mountPath: /var/applad/storage
            - name: docker-sock
              mountPath: /var/run/docker.sock
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: storage-pvc
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-certificates
  namespace: applad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-certificates
  template:
    metadata:
      labels:
        app: worker-certificates
    spec:
      containers:
        - name: worker
          image: ghcr.io/mittolabs/applad-worker:${APPLAD_VERSION:-latest}
          args: ["certificates"]
          envFrom:
            - configMapRef:
                name: applad-config
            - secretRef:
                name: applad-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -f /tmp/.worker_alive && test 20 20 12 61 79 80 81 98 701 33 100 204 250 395 398 399 400( 20 20 12 61 79 80 81 98 701 33 100 204 250 395 398 399 400date +%s) - 20 20 12 61 79 80 81 98 701 33 100 204 250 395 398 399 400date -r /tmp/.worker_alive +%s) )) -lt 120"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
